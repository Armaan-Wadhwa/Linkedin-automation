# Approval poller — Phase 2 Run B (records Harvey's Telegram decision AND,  # STEP [10]
# on a winning ✅, posts the approved draft to LinkedIn in the same run).   # STEP [10]
#
# Notes:
# - Polls every 30 min for ~8h so a tap is not lost if Harvey is away from his
#   phone when the draft lands. config.APPROVAL_EXPIRY_H sits well past the
#   last poll, so an untapped draft expires instead of lingering approvable.
# STEP [13] Window widened from 03:23-08:53 UTC to 03:23-10:53 UTC. Harvey taps
# STEP [13] mornings/afternoons IST; the old 14:23 IST cutoff missed afternoon
# STEP [13] taps (e.g. a 14:48 IST tap), which then expired/superseded unpolled.
# - Same concurrency group as daily.yml: both write pending_post.json and
#   push, so they MUST serialize (this also means daily.yml can't interrupt
#   the atomic approve→post sequence in this run).

name: approve-digest

on:
  schedule:
    # STEP [18] 24h polling (was 03:23-10:53 UTC). With the old narrow window, a
    # STEP [18] tap after 16:23 IST wasn't read until the next morning, by which
    # STEP [18] time the draft was expired/superseded. Public repo = unlimited
    # STEP [18] Actions minutes, so polling every 30 min around the clock is free.
    # STEP [32] Every 20 min (was every 30). Each run now LONG-POLLS for up to
    # STEP [32] 9 min instead of taking a zero-width snapshot, so this is both a
    # STEP [32] shorter gap between runs and real coverage inside each one.
    - cron: '9,29,49 * * * *'  # every 20 min, 24h, odd minutes  # STEP [32]
  workflow_dispatch: {}          # manual runs for testing

permissions:
  contents: write           # needed to commit pending_post.json + runs.log

concurrency:
  group: daily-digest       # MUST match daily.yml exactly (repo-wide group)
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    # STEP [32] 10 -> 14: the long-poll budget alone is 9 min, plus checkout,
    # STEP [32] setup-python and pip install before it. 10 would clip the tail.
    timeout-minutes: 14   # STEP [32]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Check out the branch TIP, not the SHA pinned when this run was
          # created. A run queued behind a late daily.yml would otherwise read
          # the previous day's pending_post.json and could approve a draft that
          # has already been superseded.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll for approval decision
        id: poll
        continue-on-error: true   # so the log/commit steps below always run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}        # STEP [10]
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}            # STEP [10]
          LINKEDIN_TOKEN_ISSUED_UTC: ${{ secrets.LINKEDIN_TOKEN_ISSUED_UTC }}# STEP [10]
          # LINKEDIN_DRY_RUN is unset in production; set to "1" only for a
          # workflow_dispatch test run that should exercise the full path
          # without publishing anything live.
        run: python src/approve.py

      - name: Append run log (keeps repo active)
        if: always()
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') approve outcome=${{ steps.poll.outcome }}" >> runs.log

      - name: Commit decision and run log
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs.log
          # pending_post.json is absent until Run A has produced a draft.
          if [ -f pending_post.json ]; then git add pending_post.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: approval poll $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      # STEP [22] Was `== 'failure'`, which fires ONLY when the step ran and exited
      # STEP [22] non-zero. A failed setup/install leaves this step 'skipped', which
      # STEP [22] the old condition ignored — the run's redness then rested on
      # STEP [22] GitHub's implicit propagation, not on any rule stated here. A
      # STEP [22] poll that never ran is never a success, so assert exactly that.
      # STEP [22] always() is required: a bare `if:` is implicitly wrapped in
      # STEP [22] success(), so after an install failure the guard would itself be
      # STEP [22] skipped and assert nothing.
      # STEP [22] Approval/posting logic is untouched: a poll that legitimately
      # STEP [22] returns 0 ("no decision yet") still exits green exactly as before.
      - name: Fail the run if the poller failed
        if: always() && steps.poll.outcome != 'success'   # STEP [22]
        run: |
          echo "poll outcome='${{ steps.poll.outcome }}' ('skipped' = an earlier setup/install step failed)"   # STEP [22]
          exit 1
