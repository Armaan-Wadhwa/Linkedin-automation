# Approval poller — Phase 2 Run B (records Harvey's Telegram decision).
# STILL NO POSTING: this workflow only writes approved/rejected into
# pending_post.json. Task 7 adds the LinkedIn step.
#
# Notes:
# - Polls every 30 min for ~6h so a tap is not lost if Harvey is away from his
#   phone when the draft lands. config.APPROVAL_EXPIRY_H sits just past the
#   last poll, so an untapped draft expires instead of lingering approvable.
# - Same concurrency group as daily.yml: both write pending_post.json and
#   push, so they MUST serialize.

name: approve-digest

on:
  schedule:
    - cron: '23,53 3-8 * * *'   # every 30 min, 03:23-08:53 UTC = 08:53-14:23 IST
  workflow_dispatch: {}          # manual runs for testing

permissions:
  contents: write           # needed to commit pending_post.json + runs.log

concurrency:
  group: daily-digest       # MUST match daily.yml exactly (repo-wide group)
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Check out the branch TIP, not the SHA pinned when this run was
          # created. A run queued behind a late daily.yml would otherwise read
          # the previous day's pending_post.json and could approve a draft that
          # has already been superseded.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll for approval decision
        id: poll
        continue-on-error: true   # so the log/commit steps below always run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/approve.py

      - name: Append run log (keeps repo active)
        if: always()
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') approve outcome=${{ steps.poll.outcome }}" >> runs.log

      - name: Commit decision and run log
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add runs.log
          # pending_post.json is absent until Run A has produced a draft.
          if [ -f pending_post.json ]; then git add pending_post.json; fi
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: approval poll $(date -u '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Fail the run if the poller failed
        if: steps.poll.outcome == 'failure'
        run: exit 1
