# Daily AI-news digest — Phase 2 Run A (generate + Telegram approval request;
# still NO posting — Run B reads the Approve/Reject decision).   # STEP [8]
#
# Cron notes (from project gotchas):
# - GitHub cron is UTC and best-effort. Target post time is ~9:00 AM IST
#   (03:30 UTC); we schedule ~35 min early on an odd minute to absorb delays.
# - Free accounts: scheduled workflows require a public repo and are disabled
#   after 60 days of repo inactivity — the runs.log commit below keeps the
#   repo active on every run, success or failure.

name: daily-digest

on:
  schedule:
    # STEP [31] FOUR morning crons, not one. GitHub's scheduled events are
    # STEP [31] best-effort and this repo loses most of them: the single 02:53Z
    # STEP [31] cron landed 03:30Z through Aug 26 (on target) and then drifted to
    # STEP [31] 07:21-08:56Z (12:51-14:26 IST) from Aug 27. Four chances 18 min
    # STEP [31] apart means a dropped, delayed, or concurrency-cancelled event
    # STEP [31] doesn't cost the day. main.py's already_ran_today() guard is what
    # STEP [31] makes this safe — the first cron GitHub actually starts writes the
    # STEP [31] draft, the other three exit 0 without generating. Odd minutes on
    # STEP [31] purpose: GitHub is most congested at :00.
    - cron: '53 2 * * *'   # 08:23 IST
    - cron: '11 3 * * *'   # 08:41 IST
    - cron: '29 3 * * *'   # 08:59 IST
    - cron: '47 3 * * *'   # 09:17 IST
  workflow_dispatch: {}     # manual runs for testing

permissions:
  contents: write           # needed to commit history.json + runs.log

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # STEP [25] Check out the branch TIP, not the SHA pinned at run creation.
          # STEP [25] daily.yml cron '53 2 * * *' lands on the SAME minute as
          # STEP [25] approve.yml's '23,53 * * * *'; both share the daily-digest
          # STEP [25] concurrency group, so they serialize. When approve.yml runs
          # STEP [25] first it pushes a commit; a stale creation-time checkout would
          # STEP [25] then build on pre-approve code and the later 'git pull --rebase'
          # STEP [25] CONFLICTS on pending_post.json + runs.log (full rewrites don't
          # STEP [25] auto-merge). approve.yml + generate_from_selection.yml already
          # STEP [25] use this ref for this exact race; daily.yml matches them.
          ref: ${{ github.event.repository.default_branch }}   # STEP [25]

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate draft
        id: gen
        continue-on-error: true   # so the log/commit steps below always run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDDIT_FEED_PARAMS: ${{ secrets.REDDIT_FEED_PARAMS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # STEP [8]
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}       # STEP [8]
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}             # STEP [14]
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}   # STEP [14]
          # STEP [31] Manual dispatch bypasses the once-a-day guard; the crons
          # STEP [31] never do. Passed via env, never interpolated into the run:
          # STEP [31] string — the STEP 23 rule, even though this value is a
          # STEP [31] literal from our own expression and not user input.
          FORCE_FLAG: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}   # STEP [31]
        # STEP [31] Unquoted on purpose: an empty FORCE_FLAG must vanish, not
        # STEP [31] become an empty argv entry that argparse rejects.
        run: python src/main.py $FORCE_FLAG

      - name: Append run log (keeps repo active)
        if: always()
        run: echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') outcome=${{ steps.gen.outcome }}" >> runs.log

      - name: Commit history and run log
        if: always()
        run: |
          git config user.name "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json runs.log
          # STEP [8] pending_post.json only exists when generation succeeded;
          # STEP [8] a bare git add of a missing file would fail this step.
          if [ -f pending_post.json ]; then git add pending_post.json; fi   # STEP [8]
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: run log $(date -u '+%Y-%m-%d') [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      # STEP [22] Was `== 'failure'`, which fires ONLY when the step ran and exited
      # STEP [22] non-zero. A failed setup/install leaves this step 'skipped', which
      # STEP [22] the old condition ignored — the run's redness then rested on
      # STEP [22] GitHub's implicit propagation, not on any rule stated here. A
      # STEP [22] generate that never ran is never a success, so assert exactly that.
      # STEP [22] always() is required: a bare `if:` is implicitly wrapped in
      # STEP [22] success(), so after an install failure the guard would itself be
      # STEP [22] skipped and assert nothing.
      - name: Fail the run if generation failed
        if: always() && steps.gen.outcome != 'success'   # STEP [22]
        run: |
          echo "generate outcome='${{ steps.gen.outcome }}' ('skipped' = an earlier setup/install step failed)"   # STEP [22]
          exit 1
